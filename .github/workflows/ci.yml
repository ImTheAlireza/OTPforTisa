name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  php:
    name: PHP syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Logic tests (blocklist rules, emergency code)
        run: |
          php tests/php/blocklist-test.php
          php tests/php/emergency-test.php
          php tests/php/breaker-test.php
          php tests/php/trusted-test.php
          php tests/php/fields-test.php
          php tests/php/report-test.php
          php tests/php/screens-test.php
          php tests/php/colour-test.php
          php tests/php/transport-test.php
          php tests/php/captcha-test.php
          php tests/php/appearance-test.php
          php tests/php/smsir-test.php
          php tests/php/direct-send-test.php
          php tests/php/settings-render-test.php
          php tests/php/app-mode-test.php
          php tests/php/wiring-test.php
          php tests/php/woodmart-test.php
          php tests/php/hardening-test.php
          php tests/php/package-test.php
      - name: The WoodMart preview page is the plugin's current output
        # The page at preview/public/woodmart.html is generated, not drawn: if
        # the renderer or the integration changes, this fails until it is
        # regenerated. `php tools/woodmart-demo.php --write` does that.
        run: php tools/woodmart-demo.php --check
      - name: Lint every PHP file
        run: |
          php -v
          failures=0
          count=0
          while IFS= read -r file; do
            count=$((count + 1))
            if ! output=$(php -l "$file" 2>&1); then
              failures=$((failures + 1))
              # Surface the real reason as an annotation, not just an exit code.
              echo "::error file=${file}::$(echo "$output" | head -n1)"
              echo "$output"
            fi
          done < <(find signa -name '*.php' | sort)
          echo "checked ${count} files, ${failures} failed"
          test "$failures" -eq 0

  front:
    name: Front-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Syntax
        run: |
          node --check signa/assets/js/front.js
          node --check signa/assets/js/admin.js
          node --check preview/server.js
      - name: PHP compile-level checks (duplicate members, bad bodies)
        run: |
          npm install --no-save php-parser
          node tools/php-static-check.js signa
      - name: Stylesheets parse, stay namespaced, and ship their fonts
        run: |
          npm install --no-save css-tree
          node tools/css-check.js
      - name: Design token contrast (WCAG 1.4.3 / 1.4.11)
        run: node tests/contrast.js
      - name: Behaviour and accessibility wiring
        run: |
          npm install --no-save jsdom
          node tests/front.js

  brand:
    name: Brand
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No trace of the former client's name
        # The product ships under its own name only. The pattern is written
        # with a character class so this file does not match itself.
        run: |
          if git grep -nIiE 't[i]sa|ت[ی]سا' -- . ; then
            echo "::error::the former client's name is still in the tree"
            exit 1
          fi
          if unzip -l signa.zip | grep -iE 't[i]sa'; then
            echo "::error::the package still carries the former name"
            exit 1
          fi

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Manifest and archive must match the sources
        run: |
          # One tool builds the package and describes it (build.json: version
          # plus a sha256 per file). The same tool verifies here that the
          # committed archive and manifest still describe the committed tree —
          # and the plugin verifies the manifest again on the site, because
          # "half the files were replaced" has to be answerable from inside.
          python3 tools/build_package.py --check
